<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volumen</title>
<meta name="theme-color" content="#e6e8eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<!-- installed on an iPhone: below the status bar, not under it. Under it (what the manifest
     alone gave), iOS 26 and later lay a Liquid Glass blur over the top ~110 px, the bar with
     it; read only when the app is added to the Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon-256.png">
<link rel="apple-touch-icon" href="/app/icon-256.png">
<!-- the interface face only: a book's faces depend on its theme and are fetched for it -->
<link rel="preload" href="/fonts/Inter.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
