[package]
name = "vol-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
postcard = { workspace = true, features = ["alloc"] }
rayon = { version = "1.12.0", optional = true }
rustc-hash = "2.1.3"
serde = { workspace = true }
serde_json.workspace = true
unicode-normalization = "0.1"
vol-ingest = { version = "0.1.0", path = "../ingest" }
vol-model = { version = "0.1.0", path = "../model" }
vol-press = { version = "0.1.0", path = "../press" }

[features]
parallel = ["dep:rayon"]

[lints]
workspace = true
